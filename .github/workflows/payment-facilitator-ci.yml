name: Payment Facilitator CI

on:
  pull_request:
    paths:
      - "payment-facilitator/**"
  push:
    branches: [main]
    paths:
      - "payment-facilitator/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-facilitator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
